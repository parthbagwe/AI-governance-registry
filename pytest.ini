[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q keeps the output readable; --strict-markers turns a typo'd marker into an
# error rather than a silently-ignored decorator.
addopts = -q --strict-markers --tb=short

filterwarnings =
    # SQLAlchemy's declarative_base and datetime.utcnow both emit deprecation
    # warnings on newer Python. They're real and worth fixing eventually, but
    # burying genuine warnings under dozens of known ones is how you stop
    # reading warnings at all.
    ignore::DeprecationWarning
